
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stream</title>
    <style>
        html, body {
            background: #0e0e10;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .video-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            flex-shrink: 0;
        }
        .chat-container {
            width: 100%;
            flex: 1;
            background: #0e0e10;
            position: relative;
        }
        iframe {
            border: none;
            width: 100%;
            height: 100%;
        }
        .chat-container iframe {
            position: absolute;
            top: 0;
            left: 0;
        }

        /* DISEÑO PARA PC Y PANTALLAS HORIZONTALES */
        @media (min-width: 768px) or (orientation: landscape) {
            body {
                flex-direction: row;
            }
            .video-container {
                width: 65%;
                height: 100%;
                aspect-ratio: auto;
            }
            .chat-container {
                width: 35%;
                height: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="video-container">
        <!-- Le ponemos un id="reproductor" para que JavaScript pueda cambiarle el video -->
        <iframe id="reproductor" src="https://ok.ru/videoembed/8254133406437" allowfullscreen></iframe>
    </div>

    <div class="chat-container">
        <iframe src="https://www.twitch.tv/embed/tolegon_s/chat?parent=okru-nu.vercel.app&darkpopout"></iframe>
    </div>

    <script>
        // Este script lee la barra de direcciones de tu navegador
        const parametros = new URLSearchParams(window.location.search);
        const idVideo = parametros.get('video');

        // Si encuentra el texto "&video=NUMERO", cambia el reproductor automáticamente
        if (idVideo) {
            document.getElementById('reproductor').src = "https://ok.ru/videoembed/" + idVideo;
        }
    </script>

</body>
</html>
