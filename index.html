
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream</title>
    <style>
        body {
            background: #0e0e10;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .video-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
        }
        .chat-container {
            width: 100%;
            flex: 1;
            background: #0e0e10;
            position: relative;
            overflow: hidden;
        }
        .chat-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            min-height: 400px; /* Fuerza al chat a tener la altura mínima donde Twitch muestra los botones */
        }
    </style>
</head>
<body>

    <div class="video-container">
        <iframe src="https://ok.ru/videoembed/8254133406437" allowfullscreen></iframe>
    </div>

    <div class="chat-container">
        <iframe src="https://www.twitch.tv/embed/tolegon_s/chat?parent=okru-nu.vercel.app&darkpopout"></iframe>
    </div>

</body>
</html>
