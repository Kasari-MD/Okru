
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat Okru</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0e0e10;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

/* VIDEO */

.video-container{
    width:100%;
    height:45vh;
    background:black;
}

.video-container iframe{
    width:100%;
    height:100%;
    border:none;
}

/* TITULO */

.chat-title{
    background:#18181b;
    color:white;
    text-align:center;
    padding:15px;
    font-size:26px;
    font-weight:bold;
    border-top:1px solid #2a2a2d;
    border-bottom:1px solid #2a2a2d;
}

/* CHAT */

.chat-container{
    width:100%;
    height:55vh;
}

.chat-container iframe{
    width:100%;
    height:100%;
    border:none;
}

</style>
</head>

<body>

<!-- VIDEO -->
<div class="video-container">
    <iframe id="videoFrame" allowfullscreen></iframe>
</div>

<!-- TITULO -->
<div class="chat-title">
    Chat del stream
</div>

<!-- CHAT -->
<div class="chat-container">
    <iframe id="chatFrame"></iframe>
</div>

<script>

const params = new URLSearchParams(window.location.search);

const twitchUser = params.get("user");
const okruVideo = params.get("video");

document.getElementById("videoFrame").src =
`https://ok.ru/videoembed/${okruVideo}`;

document.getElementById("chatFrame").src =
`https://www.twitch.tv/embed/${twitchUser}/chat?parent=okru-nu.vercel.app`;

</script>

</body>
</html>
