<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat Okru</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #0e0e10;
    font-family: Arial, sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 100vh; /* Ocupa exactamente el alto de la pantalla */
}

/* VIDEO: Reducido sutilmente al 42% para clavar la proporción de tu referencia */
.video-container {
    width: 100%;
    height: 42vh;
    background: black;
    flex-shrink: 0;
}

.video-container iframe {
    width: 100%;
    height: 100%;
    border: none;
}

/* TITULO: Estilo idéntico a la referencia (más pequeño, alineado a la izquierda y con fondo oscuro) */
.chat-title {
    background: #0e0e10;            /* Mismo fondo negro/oscuro del stream */
    color: #efeff1;                 /* Blanco grisáceo estilo Twitch */
    text-align: center;             /* Si prefieres alinearlo a la izquierda como la imagen, cambia por 'left' y añade padding-left: 15px; */
    padding: 10px 0;                /* Menos relleno para que no empuje el chat */
    font-size: 16px;                /* Fuente mucho más pequeña, igual a la captura */
    font-weight: bold;
    flex-shrink: 0;
}

/* CHAT: Se estira de forma limpia para rellenar el resto del teléfono */
.chat-container {
    width: 100%;
    flex-grow: 1;
}

.chat-container iframe {
    width: 100%;
    height: 100%;
    border: none;
}
</style>
</head>

<body>

<!-- VIDEO -->
<div class="video-container">
    <iframe id="videoFrame" allowfullscreen></iframe>
</div>

<!-- TITULO -->
<div class="chat-title">
    Chat del stream
</div>

<!-- CHAT -->
<div class="chat-container">
    <iframe id="chatFrame"></iframe>
</div>

<script>

const params = new URLSearchParams(window.location.search);

const twitchUser = params.get("user");
const okruVideo = params.get("video");

document.getElementById("videoFrame").src =
`https://ok.ru/videoembed/${okruVideo}`;

document.getElementById("chatFrame").src =
`https://www.twitch.tv/embed/${twitchUser}/chat?parent=okru-nu.vercel.app`;

</script>

</body>
</html>
