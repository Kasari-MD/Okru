
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stream</title>
    <style>
        html, body {
            background: #0e0e10;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .video-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            flex-shrink: 0;
        }
        .chat-container {
            width: 100%;
            flex: 1;
            background: #0e0e10;
            position: relative;
        }
        .chat-container iframe {
            border: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>

    <div class="video-container">
        <iframe src="https://ok.ru/videoembed/8254133406437" width="100%" height="100%" allowfullscreen></iframe>
    </div>

    <div class="chat-container">
        <iframe src="https://www.twitch.tv/embed/tolegon_s/chat?parent=okru-nu.vercel.app&darkpopout"></iframe>
    </div>

</body>
</html>
