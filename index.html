
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stream</title>
    <style>
        html, body {
            background: #0e0e10;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column; /* Celular: video arriba, chat abajo */
            overflow: hidden;
        }
        .video-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            flex-shrink: 0;
        }
        .chat-container {
            width: 100%;
            flex: 1;
            background: #0e0e10;
            position: relative;
        }
        .chat-container iframe {
            border: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* DISEÑO PARA PC Y PANTALLAS HORIZONTALES */
        @media (min-width: 768px) or (orientation: landscape) {
            body {
                flex-direction: row; /* PC: video a la izquierda, chat a la derecha */
            }
            .video-container {
                width: 75%; /* El video ocupa el 75% del ancho */
                height: 100%;
                aspect-ratio: auto; /* Desactivamos esto en PC para que use todo el alto disponible */
            }
            .chat-container {
                width: 25%; /* El chat se queda con el 25% derecho */
                height: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="video-container">
        <iframe src="https://ok.ru/videoembed/8254133406437" width="100%" height="100%" allowfullscreen></iframe>
    </div>

    <div class="chat-container">
        <iframe src="https://www.twitch.tv/embed/tolegon_s/chat?parent=okru-nu.vercel.app&darkpopout"></iframe>
    </div>

</body>
</html>
