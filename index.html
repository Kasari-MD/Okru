
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat Okru</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #0e0e10;
    font-family: Arial, sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 100vh; /* Alto exacto de la pantalla del celular */
}

/* VIDEO: Ahora su altura es automática y mantiene la proporción 16:9 perfecta */
.video-container {
    width: 100%;
    height: auto;           /* ← CAMBIADO: Ya no usa vh, se ajusta al contenido */
    aspect-ratio: 16 / 9;   /* ¡NUEVO! Fuerza la proporción exacta de la transmisión */
    background: black;
    flex-shrink: 0;
}

.video-container iframe {
    width: 100%;
    height: 100%;
    border: none;
}

/* CHAT: Se seguirá estirando para ocupar todo el resto de la pantalla */
.chat-container {
    width: 100%;
    flex-grow: 1;
}

.chat-container iframe {
    width: 100%;
    height: 100%;
    border: none;
}
</style>
</head>

<body>

<div class="video-container">
    <iframe id="videoFrame" allowfullscreen></iframe>
</div>

<div class="chat-container">
    <iframe id="chatFrame"></iframe>
</div>

<script>
const params = new URLSearchParams(window.location.search);

const twitchUser = params.get("user");
const okruVideo = params.get("video");

document.getElementById("videoFrame").src =
`https://ok.ru/videoembed/${okruVideo}`;

document.getElementById("chatFrame").src =
`https://www.twitch.tv/embed/${twitchUser}/chat?parent=okru-nu.vercel.app&darkpopout`;
</script>

</body>
</html>
